; Unified pytest configuration for every plugin test suite in this repo.
;
; run_tests.py points pytest at this file (`-c`), so it replaces the per-suite
; pyproject.toml: the markers and the default tier selection below have to stay
; in sync with claude/dev-plugin-tests/, codex/dev-plugin-test/,
; opencode/dev-plugin-test/, pi/dev-plugin-tests/ and
; hermes/dev-plugin-tests/pyproject.toml, which still apply when pytest is run
; directly inside a suite directory.
;
; Report layout follows mysql-shell-plugins/mcp_plugin/pytest-coverage.ini:
; terminal summary + Cobertura XML + HTML. The JUnit XML is named per suite on
; the command line (run_tests.py) so the suites don't overwrite each other's.
[pytest]
junit_family = xunit1
markers =
    static: structural/static checks of the skills (no DB, no LLM) — the always-on CI gate
    db: SQL executed against a live MariaDB 11.8 (needs a reachable server)
    eval: behavioral LLM evals (needs an LLM API key; deselected by default)
    e2e: full agent CLI run with the plugin + MCP server (needs the agent CLI and mariadb-shell; deselected by default)
addopts = --color=yes -ra -m "not eval and not e2e"
    --junitxml=test-results/tests.xml
    --cov-report term
    --cov-report xml:test-results/coverage.xml
    --cov-report html
    --cov-config=.coveragerc
